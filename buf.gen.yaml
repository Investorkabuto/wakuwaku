version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: server/internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: server/internal/gen
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/lib/gen
    opt: target=ts
